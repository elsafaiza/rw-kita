<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login Admin - RW KITA</title>

  <link
    rel="stylesheet"
    href="../static/css/login-admin.css"
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >
</head>

<body>

  <main class="login-page">

    <section class="login-image">
      <img
        src="../static/image/Kelurahan.png"
        alt="Ilustrasi lingkungan RW KITA"
      >
    </section>

    <section class="login-area">

      <div class="login-card">

        <div class="login-icon">
          <img
            src="../static/icon/user.png"
            alt="User"
          >
        </div>

        <h1>Login Admin</h1>

        <p class="login-subtitle">
          Masuk ke panel pengelolaan RW KITA
        </p>

        <form
          id="login-form"
          class="login-form"
        >

          <div class="form-group">

            <label for="username">
              Email
            </label>

            <div class="input-wrapper">

              <img
                class="input-icon"
                src="../static/icon/mail.png"
                alt=""
              >

              <input
                type="email"
                id="username"
                name="username"
                placeholder="Masukkan email"
                autocomplete="username"
                required
              >

            </div>

          </div>

          <div class="form-group">

            <label for="password">
              Password
            </label>

            <div class="input-wrapper">

              <img
                class="input-icon"
                src="../static/icon/padlock.png"
                alt=""
              >

              <input
                type="password"
                id="password"
                name="password"
                placeholder="Masukkan password"
                autocomplete="current-password"
                required
              >

              <button
                type="button"
                class="password-toggle"
                id="togglePassword"
                aria-label="Tampilkan password"
              >
                <img
                  src="../static/icon/view.png"
                  alt=""
                >
              </button>

            </div>

          </div>

          <div class="login-options">

            <label class="remember-me">
              <input
                type="checkbox"
                name="remember"
              >

              <span>Ingat saya</span>
            </label>

            <a
              href="#"
              class="forgot-password"
              id="forgot-password"
            >
              Lupa password?
            </a>

          </div>

          <p
            id="login-message"
            class="login-message"
            aria-live="polite"
          ></p>

          <button
            type="submit"
            class="login-button"
          >
            Masuk
          </button>

        </form>

        <div class="login-info">

          <div class="login-info-text">
            Akses ini hanya untuk pengguna yang memiliki izin.
          </div>

          <div class="login-roles">
            <span>Super Admin</span>
            <b>•</b>
            <span>Admin RW</span>
            <b>•</b>
            <span>Editor</span>
          </div>

        </div>

        <a
          href="index.html"
          class="back-website"
        >
          <span class="back-arrow">←</span>
          <span>Kembali ke website</span>
        </a>

      </div>

    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../static/js/supabase.js"></script>
  <script src="../static/js/login-admin.js"></script>

</body>
</html>
